name: Build King Copilot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KingCopilot_v0.1_Brasil.zip"
      - ".github/workflows/build-king-copilot.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract project
        run: unzip -o KingCopilot_v0.1_Brasil.zip

      - name: Build debug APK
        working-directory: KingCopilot/android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KingCopilot-debug-apk
          path: KingCopilot/android/app/build/outputs/apk/debug/app-debug.apk

# trigger build
