name: Build King Copilot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "kingcopilot-android/**"
      - ".github/workflows/build-king-copilot.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: kingcopilot-android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp kingcopilot-android/app/build/outputs/apk/debug/app-debug.apk KingCopilot-v0.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KingCopilot-APK
          path: KingCopilot-v0.2-debug.apk
